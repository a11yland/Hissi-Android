name: Release

# Manual only. Bumps the version in app/build.gradle.kts, builds the signed
# release bundle, commits the bump through the GitHub API (so GitHub signs it
# and it passes the verified-signatures rule on main), tags it and publishes
# a GitHub release with the AAB and the R8 mapping. Uploading to Play stays manual (see
# docs/android-distribution.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "versionName for the release (e.g. 1.1). versionCode is incremented automatically."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate input and ref
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main only (got $GITHUB_REF)."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::version must look like 1.1 or 1.1.0 (got '$VERSION')."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi

      # A release must not ship a seed (or test against fixtures) older than
      # Hissi-iOS main — the shared-files workflow only warns day to day, so
      # the gate is here. Merge its sync PR (or run it manually) first.
      - name: Check out the iOS originals
        uses: actions/checkout@v5
        with:
          repository: a11yland/Hissi-iOS
          ref: main
          path: ios
          sparse-checkout: |
            Shared/Resources/seed-catalog.json
            HissiTests/Tests/Fixtures/
          sparse-checkout-cone-mode: false

      - name: Shared files in step with Hissi-iOS
        run: |
          status=0
          if ! cmp -s app/src/main/assets/seed-catalog.json ios/Shared/Resources/seed-catalog.json; then
            echo "::error::The seed catalog differs from Hissi-iOS main — merge the shared-sync PR first."
            status=1
          fi
          if ! diff -rq core/src/test/fixtures ios/HissiTests/Tests/Fixtures; then
            echo "::error::The test fixtures differ from Hissi-iOS main — merge the shared-sync PR first."
            status=1
          fi
          # Out of the workspace before the build and the bump commit.
          rm -rf ios
          exit "$status"

      - name: Bump versionCode and versionName
        env:
          VERSION: ${{ inputs.version }}
        run: |
          file=app/build.gradle.kts
          current=$(sed -nE 's/^ *versionCode = ([0-9]+)$/\1/p' "$file")
          next=$((current + 1))
          sed -i -E "s/^( *versionCode = )[0-9]+$/\1$next/" "$file"
          sed -i -E "s/^( *versionName = )\"[^\"]*\"$/\1\"$VERSION\"/" "$file"
          grep -E 'version(Code|Name) =' "$file"
          echo "VERSION_CODE=$next" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Write local.properties and keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.HISSI_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HISSI_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HISSI_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HISSI_UPLOAD_KEY_PASSWORD }}
          TRANSIT_TOKEN: ${{ secrets.HISSI_TRANSIT_TOKEN }}
          MAPS_API_KEY: ${{ secrets.HISSI_MAPS_API_KEY }}
        run: |
          missing=0
          for pair in KEYSTORE_BASE64:HISSI_UPLOAD_KEYSTORE_BASE64 STORE_PASSWORD:HISSI_UPLOAD_STORE_PASSWORD \
                      KEY_ALIAS:HISSI_UPLOAD_KEY_ALIAS KEY_PASSWORD:HISSI_UPLOAD_KEY_PASSWORD \
                      TRANSIT_TOKEN:HISSI_TRANSIT_TOKEN MAPS_API_KEY:HISSI_MAPS_API_KEY; do
            var=${pair%%:*}; secret=${pair#*:}
            if [ -z "${!var}" ]; then
              echo "::error::Secret $secret is not set."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          keystore="$RUNNER_TEMP/upload.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          cat > local.properties <<EOF
          hissi.transitToken=$TRANSIT_TOKEN
          hissi.mapsApiKey=$MAPS_API_KEY
          hissi.upload.storeFile=$keystore
          hissi.upload.storePassword=$STORE_PASSWORD
          hissi.upload.keyAlias=$KEY_ALIAS
          hissi.upload.keyPassword=$KEY_PASSWORD
          EOF

      - name: Unit tests and signed release bundle
        run: ./gradlew test :app:bundleRelease

      - name: Collect artifacts
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/hissi-$VERSION.aab"
          cp app/build/outputs/mapping/release/mapping.txt "dist/hissi-$VERSION-mapping.txt"
          ls -l dist

      # main requires verified signatures, so a plain `git commit` + `git push`
      # from the runner is rejected (GH013). Commits created through the REST
      # API with the workflow token are signed by GitHub and count as verified.
      # The tag is only created after main has moved, so a rejected update can
      # no longer leave a tag pointing at a commit that is not on main.
      - name: Commit bump and tag via GitHub API (signed)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          file=app/build.gradle.kts
          api="repos/$GITHUB_REPOSITORY"
          parent="$GITHUB_SHA"

          base_tree=$(gh api "$api/git/commits/$parent" --jq .tree.sha)
          blob=$(jq -n --rawfile content "$file" '{content: $content, encoding: "utf-8"}' \
            | gh api "$api/git/blobs" --input - --jq .sha)
          tree=$(jq -n --arg base "$base_tree" --arg path "$file" --arg sha "$blob" \
            '{base_tree: $base, tree: [{path: $path, mode: "100644", type: "blob", sha: $sha}]}' \
            | gh api "$api/git/trees" --input - --jq .sha)
          # No author/committer: GitHub then signs the commit as github-actions[bot].
          commit=$(jq -n --arg msg "chore(release): v$VERSION (versionCode $VERSION_CODE)" \
            --arg tree "$tree" --arg parent "$parent" \
            '{message: $msg, tree: $tree, parents: [$parent]}' \
            | gh api "$api/git/commits" --input - --jq .sha)

          verified=$(gh api "$api/git/commits/$commit" --jq .verification.verified)
          echo "Bump commit $commit (verified: $verified)"
          if [ "$verified" != "true" ]; then
            echo "::error::GitHub did not sign the bump commit; main would reject it."
            exit 1
          fi

          # Fast-forward only: fails if main moved since the run started.
          gh api -X PATCH "$api/git/refs/heads/main" -f sha="$commit" -F force=false >/dev/null

          tag=$(jq -n --arg tag "v$VERSION" --arg msg "Hissi $VERSION" --arg sha "$commit" \
            '{tag: $tag, message: $msg, object: $sha, type: "commit"}' \
            | gh api "$api/git/tags" --input - --jq .sha)
          gh api "$api/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$tag" >/dev/null
          echo "Tagged v$VERSION -> $commit"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "Hissi $VERSION" \
            --generate-notes \
            "dist/hissi-$VERSION.aab#Release bundle (AAB, versionCode $VERSION_CODE)" \
            "dist/hissi-$VERSION-mapping.txt#R8 mapping"
