[versions]
agp = "9.4.1"
# Must match the KGP version AGP bundles for built-in Kotlin (see the
# org.jetbrains.kotlin:kotlin-gradle-plugin dependency in AGP's POM).
kotlin = "2.2.10"
composeBom = "2026.08.00"
activityCompose = "1.13.0"
coreKtx = "1.19.0"
# Ktor/serialization/coroutines are pinned to releases built with Kotlin <= 2.2
# so their metadata stays readable for the 2.2.10 compiler above.
ktor = "3.3.3"
kotlinxSerialization = "1.9.0"
kotlinxCoroutines = "1.10.2"
datastore = "1.2.1"
lifecycle = "2.11.0"
# The icons artifacts left the Compose BOM; the extended set is stable API.
composeIconsExtended = "1.7.8"
# Last release built with Kotlin <= 2.2 (newer ones carry 2.4 metadata,
# unreadable for AGP's bundled 2.2.10 compiler) — same pin rationale as Ktor.
mapsCompose = "7.0.0"
glance = "1.1.1"
workManager = "2.10.0"
# Drag-to-reorder for LazyColumn (favorites list). Compose ships no reorder
# support of its own.
reorderable = "2.5.1"

[libraries]
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "composeIconsExtended" }
maps-compose = { group = "com.google.maps.android", name = "maps-compose", version.ref = "mapsCompose" }
glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
reorderable = { group = "sh.calvin.reorderable", name = "reorderable", version.ref = "reorderable" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
